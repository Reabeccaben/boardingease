<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardingEase — markup reference</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <header class="masthead">
      <div class="masthead__inner">
        <p class="wordmark">Boarding<span>Ease</span></p>
        <p class="masthead__tagline">
          Markup reference — every state, hardcoded
        </p>
      </div>
    </header>

    <main class="layout">
      <section class="search" aria-labelledby="search-heading">
        <h1 id="search-heading" class="search__heading">
          Where are you staying this semester?
        </h1>

        <form class="search__form" id="search-form">
          <label class="field">
            <span class="field__label">Search</span>

            <input
              class="field__input"
              type="search"
              value=""
              autocomplete="off"
              id="search-input"
              placeholder="Search by place"
            />
          </label>

          <label class="field field--narrow">
            <span class="field__label">Max rent</span>

            <input
              class="field__input"
              type="number"
              min="0"
              step="500"
              placeholder="8000"
              id="max-input"
            />
          </label>

          <button class="button" type="submit">Search</button>
        </form>

        <p class="search__count">0 listings found</p>
      </section>

      <div class="columns">
        <section class="results">
          <ul class="results__list">
            <!-- Dire ta mag insert ug card list -->
          </ul>
        </section>

        <aside class="detail">
          <p class="detail__empty">
            Select a listing to see the cost breakdown.
          </p>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <p>
        ITPFE 1 — Web Systems and Technologies 2 · Faculty of Computing,
        Engineering, and Technology
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
